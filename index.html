<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MQS Plotter" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>MQS Map Plotter</title>
    <meta name="description" content="Interactive map plotter and coordinate dashboard for exploring maps, dropping customized landmark pins, and managing coordinates." />
    <meta property="og:title" content="MQS Map Plotter" />
    <meta property="og:description" content="Interactive map plotter and coordinate dashboard for exploring maps, dropping customized landmark pins, and managing coordinates." />
    <script>
      (function() {
        var _err = console.error;
        console.error = function() {
          var str = Array.prototype.slice.call(arguments).map(function(a) {
            return (a && a.message) || String(a);
          }).join(' ');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('@vite/client') !== -1) {
            return;
          }
          return _err.apply(console, arguments);
        };
        window.addEventListener('error', function(event) {
          if (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client'))) {
            event.stopImmediatePropagation();
          }
        });
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && String(event.reason).includes('WebSocket')) {
            event.stopImmediatePropagation();
          }
        });
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
