<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Map Grid Lines -->
  <path d="M 64 160 L 448 160 M 64 256 L 448 256 M 64 352 L 448 352 M 160 64 L 160 448 M 256 64 L 256 448 M 352 64 L 352 448" stroke="#334155" stroke-width="3" stroke-dasharray="6,6" opacity="0.4" />

  <!-- Outer Pulse Ring -->
  <circle cx="256" cy="230" r="140" fill="none" stroke="#0284c7" stroke-width="4" opacity="0.3" />

  <!-- Map Pin Body -->
  <g filter="url(#glow)">
    <path d="M 256 80 C 180 80 120 140 120 216 C 120 310 236 415 250 427 C 253 430 259 430 262 427 C 276 415 392 310 392 216 C 392 140 332 80 256 80 Z" fill="url(#pinGrad)" />
  </g>

  <!-- Pin Center Golden Coin -->
  <circle cx="256" cy="216" r="62" fill="url(#goldGrad)" stroke="#fef3c7" stroke-width="6" />

  <!-- Coin Inner Emboss -->
  <circle cx="256" cy="216" r="48" fill="none" stroke="#b45309" stroke-width="3" stroke-dasharray="8,4" />
  
  <!-- MQS Lettering / Coin Emblem -->
  <path d="M 232 236 L 232 196 L 256 220 L 280 196 L 280 236" fill="none" stroke="#78350f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
